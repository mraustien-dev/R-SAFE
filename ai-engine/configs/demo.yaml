# Demo settings: same as default.yaml, but every frame is processed (short 10 fps clips)
# and records go to output/demo so they don't mix with real records.
# R-SAFE AI engine settings.
# Relative model paths are resolved from the ai-engine folder.

video:
  source: ""            # file path, IP Webcam URL (http://<phone-ip>:8080/video) or camera index ("0")
  camera_id: cam-01
  frame_stride: 1       # every frame: demo clips are short

vehicle:
  model: models/vehicle/yolo11s.pt   # COCO-pretrained; downloaded by Ultralytics if missing
  confidence: 0.35
  imgsz: 640
  tracker: bytetrack.yaml

association:
  expand_ratio: 0.15    # enlarge motorcycle box by this fraction per side when matching riders
  max_riders: 3

helmet:
  model: models/helmet/best.onnx
  confidence: 0.25
  head_ratio: 0.40      # top fraction of the rider box used as the head crop
  pad_ratio: 0.20
  min_rider_height_px: 48
  imgsz: 640            # head crops are resized to this square; smaller = faster

rules:
  window: 10            # last N confident helmet checks per rider
  min_confidence: 0.50
  min_votes: 3          # no_helmet votes needed to flag (tuned on HELMET validation clips)
  track_lost_frames: 30 # source frames without a sighting before a track is closed

plate:
  enabled: true         # measured in Task 9: models/plate/SOURCE.md
  detector_model: models/plate/plate.onnx
  ocr: easyocr
  max_attempts: 5
  min_ocr_confidence: 0.90   # lower cutoffs mostly showed wrong plate text (SOURCE.md)

evidence:
  output_dir: output/demo/violations
  timezone_offset_hours: 8   # Philippine time

sink:
  kind: file            # file | http
  http:
    url: ""
    timeout_s: 10

logging:
  level: INFO
